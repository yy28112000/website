<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f1">
<title>Travel Notes｜旅行プラン</title>
<style>
:root{
  --bg:#f4f5f2;--paper:#fff;--text:#242724;--sub:#727b74;
  --line:#e0e5e0;--green:#54705f;--soft:#eef2ee;--r:20px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  line-height:1.7;-webkit-font-smoothing:antialiased
}
a{color:inherit;text-decoration:none}
.wrap{width:min(900px,calc(100% - 32px));margin:auto}
.hero{padding:64px 0 40px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green)}
h1{margin:8px 0 10px;font-size:clamp(36px,8vw,62px);line-height:1.08;font-weight:500;letter-spacing:-.04em}
.lead{margin:0;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:70px}
.trip{
  display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:22px;transition:.2s
}
.trip:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(30,45,35,.06)}
.tag{font-size:11px;letter-spacing:.12em;color:var(--green)}
h2{margin:7px 0 6px;font-size:24px;font-weight:500;letter-spacing:-.02em}
.meta{font-size:13px;color:var(--sub)}
.arrow{margin-top:18px;color:var(--green);font-size:14px}
.add{
  border-style:dashed;background:transparent;color:var(--sub)
}
.note{padding:18px 0 32px;color:var(--sub);font-size:13px}
@media(max-width:680px){.hero{padding:46px 0 30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">TRAVEL NOTES</div>
    <h1>旅行プラン</h1>
    <p class="lead">行き先ごとのプランをまとめた、わが家の旅行メモ。</p>
  </header>

  <main class="grid">
    <a class="trip" href="./trips/wakayama/">
      <div class="tag">WAKAYAMA · 1 NIGHT / 2 DAYS</div>
      <h2>白浜・和歌山</h2>
      <div class="meta">マカロンと海、温泉、海鮮、桃。</div>
      <div class="arrow">プランを見る →</div>
    </a>

    <a class="trip" href="./trips/awajishima/">
      <div class="tag">AWAJI ISLAND · DAY TRIP</div>
      <h2>淡路島</h2>
      <div class="meta">花さじき、のじまスコーラ、伊弉諾神宮、うずの丘。</div>
      <div class="arrow">プランを見る →</div>
    </a>

    <div class="trip add">
      <div class="tag">NEXT TRIP</div>
      <h2>＋ 次の旅行</h2>
      <div class="meta">新しい旅行は trips/ の中にフォルダを追加して、この一覧にリンクを1枚足すだけ。</div>
    </div>
  </main>

  <div class="note">GitHub Pages では、この index.html が旅行一覧のトップページになります。</div>
</div>
</body>
</html>
